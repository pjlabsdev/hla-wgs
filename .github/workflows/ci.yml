name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Usage text
        shell: bash
        run: ./target/release/hla-wgs --version
      - name: Start file syntax
        if: runner.os != 'Windows'
        run: bash -n start/hla-wgs-start.command
      - name: Start file syntax (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/start/hla-wgs-start.ps1", [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
