[package]
name = "hla-wgs"
version = "1.2.0"
edition = "2024"
description = "HLA typing from whole-genome sequencing reads with a per-allele statement of what is certain"
license = "MIT"
repository = "https://github.com/pjlabsdev/hla-wgs"

[dependencies]
ahash = "0.8.12"
flate2 = "1.1.11"
noodles = { version = "0.119", features = ["bam", "cram", "sam", "bgzf", "core", "fasta", "csi"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
# only for `hla-wgs-validate paper` (the report as PDF): cargo build --release --features paper
typst = { version = "0.15.1", optional = true }
typst-layout = { version = "0.15.1", optional = true }
typst-pdf = { version = "0.15.1", optional = true }

[features]
paper = ["dep:typst", "dep:typst-layout", "dep:typst-pdf"]

[profile.release]
opt-level = 3
