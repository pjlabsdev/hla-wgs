# Browser build of hla-wgs: the same sources (../src) compiled to WebAssembly.
# The version must equal the one in ../Cargo.toml (it is printed into every result); build.sh checks it.
[package]
name = "hla-wgs"
version = "1.2.0"
edition = "2024"
description = "hla-wgs in the browser (WebAssembly)"
license = "MIT"
publish = false
# same commit stamp for the run log as the native program
build = "../build.rs"

[lib]
path = "../src/main.rs"
crate-type = ["cdylib"]

[dependencies]
gc-panel = { path = "../crates/gc-panel" }
ahash = "0.8.12"
flate2 = "1.1.11"
noodles = { version = "0.119", features = ["bam", "cram", "sam", "bgzf", "core", "fasta", "csi"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
wasm-bindgen = "=0.2.106"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Blob", "File", "FileReaderSync"] }
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# its own workspace, apart from the native program
[workspace]
